<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Machine 2.0 | Portal VIP</title>
    <!-- Carga de Marked.js para formatear HTML limpio -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #0f172a;
            --accent: #00ff88;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
        h1 { color: var(--accent); margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--muted); }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #090d16; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; background: var(--accent); color: #030712; font-weight: 900; padding: 15px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 1.1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #output { margin-top: 30px; padding: 25px; background: #090d16; border: 1px solid var(--border); border-radius: 12px; line-height: 1.7; color: #e2e8f0; }
        #output h3 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 25px; }
        #output pre { background: #030712; padding: 15px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; color: #38bdf8; }
        #output code { font-family: monospace; }
        .status { font-size: 0.9rem; color: #38bdf8; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Motor Estratégico Cash Machine 2.0</h1>
        <p style="color: var(--muted);">Genera tu estrategia personalizada y obtén tu prompt maestro de creación web.</p>

        <label>Clave de Acceso VIP:</label>
        <input type="password" id="pass" placeholder="Ingresa tu clave de acceso">

        <label>Nicho o Mercado:</label>
        <input type="text" id="nicho" placeholder="Ej: Automatizaciones n8n para agencias">

        <label>Recursos Disponibles:</label>
        <input type="text" id="recursos" placeholder="Ej: $0 USD + 10h/semana + Laptop">

        <label>Estilo / Tono de Respuesta:</label>
        <select id="tono">
            <option value="Hacker pragmático (directo al grano)">Hacker pragmático (Directo al grano)</option>
            <option value="Navaja suiza agresivo">Navaja suiza agresivo (Enfocado en ventas)</option>
            <option value="Militar minimalista">Militar minimalista (Pasos estrictos)</option>
            <option value="Tiburón de ventas directas">Tiburón de ventas (Alta persuasión)</option>
        </select>

        <button id="btn-generar" onclick="generarEstrategia()">Generar Estrategia + Prompt Web Maestro</button>
        <div id="status" class="status"></div>

        <div id="output" style="display:none;"></div>
    </div>

    <script>
        const API_KEY = atob("c2stb3ItdjEtM2RjY2U3OGE0YmZlNTg5NGEwZjBiNjYxMDBlMTJkYzk1YWJmMzA3MmRjYTJhNWI0ZGMyZmY2ODc1NmY4ZWQ2Ng==");
        const CLAVE_CORRECTA = "CASHVIP2026";

        async function llamarAPIConReintentos(payload, intentos = 3) {
            for (let i = 0; i < intentos; i++) {
                try {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${API_KEY}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": "https://cashmachine20.netlify.app",
                            "X-Title": "Cash Machine 2.0"
                        },
                        body: JSON.stringify(payload)
                    });

                    if (res.status === 429) {
                        document.getElementById("status").innerText = `Motor ocupado. Reintentando en 3 segundos... (Intento ${i + 1}/${intentos})`;
                        await new Promise(r => setTimeout(r, 3000));
                        continue;
                    }

                    if (!res.ok) {
                        const errorData = await res.json().catch(() => ({}));
                        const errorMsg = errorData.error?.message || `Error HTTP ${res.status}`;
                        throw new Error(errorMsg);
                    }

                    return await res.json();
                } catch (err) {
                    if (i === intentos - 1) throw err;
                }
            }
        }

        async function generarEstrategia() {
            const pass = document.getElementById("pass").value;
            const nicho = document.getElementById("nicho").value;
            const recursos = document.getElementById("recursos").value;
            const tono = document.getElementById("tono").value;
            const status = document.getElementById("status");
            const output = document.getElementById("output");
            const btn = document.getElementById("btn-generar");

            if (pass !== CLAVE_CORRECTA) {
                alert("Clave VIP incorrecta.");
                return;
            }

            if (!nicho || !recursos) {
                alert("Por favor completa el nicho y tus recursos.");
                return;
            }

            btn.disabled = true;
            status.innerText = "Conectando con la IA... Creando tu plan y Prompt Web...";
            output.style.display = "none";

            const promptSystem = `Eres el motor estratégico principal de Cash Machine 2.0. Tu objetivo es diseñar un plan de monetización ejecutable y entregar un Prompt Web listo para copiar y pegar.

CONTEXTO DEL USUARIO:
- Nicho: ${nicho}
- Recursos: ${recursos}
- Tono: ${tono}

REGLAS DE ORO:
1. Filtro de Dominio: Si el nicho NO está relacionado con negocios o ingresos, responde únicamente: "Solo puedo diseñar estrategias de negocios para Cash Machine 2.0."
2. Mimetización de Tono: Adapta tu personalidad al estilo indicado en Tono.
3. Cero Paja: Directo al grano.
4. Sección Cero-Código: Incluye instrucciones paso a paso para personas sin conocimientos técnicos sobre qué hacer con el prompt generado (ej: usar ChatGPT, Claude o DeepSeek y llevar el resultado a herramientas gratuitas como Carrd.co, Systeme.io o Framer).

ESTRUCTURA DE SALIDA OBLIGATORIA:
### 🛠️ Fase 1: Despliegue Inmediato
[Pasos concretos]

### 🧲 Fase 2: Estrategia de Adquisición
[Pasos de captación]

### ⚙️ Fase 3: Piloto Automático
[Automatización]

### 🌐 Guiado Cero-Técnico: Cómo Crear tu Sitio Web sin Saber Programar
[Explicación concisa en 3 pasos simples sobre dónde pegar el prompt y qué plataforma gratuita usar].

### 📋 Bonus: Prompt Maestro para Construir tu Plataforma Web
(Copia todo el bloque de código a continuación y pégalo en ChatGPT, Claude o DeepSeek para que diseñe tu landing page):

\`\`\`text
Actúa como un Diseñador Web y Copywriter Senior experto en conversión.
Necesito que diseñes la estructura completa y el texto de ventas para una Landing Page enfocada en el nicho: "${nicho}".
Genera:
1. Titular llamativo con propuesta de valor única.
2. Estructura de secciones (Hero, Problema, Solución, Beneficios, Prueba Social, Llamado a la Acción).
3. Código HTML/CSS básico o guía lista para pegar en Carrd / Systeme.io.
4. Instrucciones paso a paso como si yo fuera un principiante total de 10 años.
\`\`\``;

            const payload = {
                models: [
                    "nvidia/nemotron-4-340b-instruct",
                    "meta-llama/llama-3.3-70b-instruct:free",
                    "openrouter/free"
                ],
                messages: [{ role: "system", content: promptSystem }]
            };

            try {
                const data = await llamarAPIConReintentos(payload);
                const respuesta = data.choices[0].message.content;
                output.innerHTML = marked.parse(respuesta);
                output.style.display = "block";
                status.innerText = "¡Estrategia y Prompt Web generados con éxito!";
            } catch (err) {
                status.innerText = `❌ Error: ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
